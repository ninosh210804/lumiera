[build]
  cmd = "go build -o ./tmp/main ./cmd/server"
  bin = "./tmp/main"
  full_bin = "./tmp/main"
  include_ext = ["go", "tpl", "tmpl", "html"]
  exclude_dir = ["tmp", "vendor", "testdata", "internal/db/postgres/generated", "internal/db/sqlite/generated"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  delay = 300
  kill_delay = "2s"
  rerun = false

[log]
  time = false
  main_only = false

[color]
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = true

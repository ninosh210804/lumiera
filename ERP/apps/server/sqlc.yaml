version: "2"
sql:
  - engine: "postgresql"
    queries: "../../db/queries/postgres"
    schema: "../../db/migrations/postgres"
    gen:
      go:
        package: "pgdb"
        out: "internal/db/postgres/generated"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_db_tags: true
        emit_interface: true
        emit_pointers_for_null_types: true
        emit_enum_valid_method: true
        emit_all_enum_values: true

  - engine: "sqlite"
    queries: "../../db/queries/sqlite"
    schema: "../../db/migrations/sqlite"
    gen:
      go:
        package: "litedb"
        out: "internal/db/sqlite/generated"
        emit_json_tags: true
        emit_db_tags: true
        emit_interface: true
        emit_pointers_for_null_types: true

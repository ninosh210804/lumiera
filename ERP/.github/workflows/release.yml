name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-server:
    name: Build and publish Go server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Build Linux binary
        working-directory: apps/server
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o bin/server-linux ./cmd/server

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/server/bin/server-linux
          generate_release_notes: true

version: '3.8'

services:
  shipment-service:
    build: .
    container_name: shipment-service
    ports:
      - "50051:50051"
    environment:
      - LOG_LEVEL=info
    networks:
      - shipment-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:50051"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  shipment-network:
    driver: bridge
